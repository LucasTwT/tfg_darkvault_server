services:
  db:
    image: postgres:15
    container_name: darkvault_db
    restart: always
    env_file:
      - .env.postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: darkvault_backend
    ports:
      - "8000:8000"
    env_file:
      - .env.server
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
